<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f3e8" />
    <title>aMazeGame</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-left">
          <span class="hud-label">Player</span>
          <span id="player-name" class="hud-value">—</span>
        </div>
        <div class="hud-right">
          <span class="hud-label">Mazes solved</span>
          <span id="score" class="hud-value">0</span>
        </div>
      </header>
      <main id="stage">
        <canvas id="maze"></canvas>
      </main>
      <footer class="hint">swipe ↑ ↓ ← → to steer</footer>
    </div>
    <dialog id="name-dialog">
      <form method="dialog">
        <h2>Who's playing?</h2>
        <input
          id="name-input"
          name="name"
          maxlength="24"
          required
          autocomplete="off"
          placeholder="your name"
        />
        <button value="ok" type="submit">Start</button>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
