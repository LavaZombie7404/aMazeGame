<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f3e8" />
    <title>aMazeGame</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-left">
          <span class="hud-label">Player</span>
          <span id="player-name" class="hud-value">—</span>
        </div>
        <div class="hud-center">
          <button
            id="reset-btn"
            type="button"
            aria-label="Skip this maze and generate a new one"
            title="New maze"
          >
            ↻
          </button>
          <button
            id="settings-btn"
            type="button"
            aria-label="Open settings"
            title="Settings"
          >
            ⚙
          </button>
        </div>
        <div class="hud-right">
          <span class="hud-label">Mazes solved</span>
          <span id="score" class="hud-value">0</span>
        </div>
      </header>
      <main id="stage">
        <canvas id="maze"></canvas>
      </main>
      <footer class="hint">swipe ↑ ↓ ← → to steer</footer>
    </div>
    <dialog id="name-dialog">
      <form method="dialog">
        <h2>Who's playing?</h2>
        <input
          id="name-input"
          name="name"
          maxlength="24"
          required
          autocomplete="off"
          placeholder="your name"
        />
        <button value="ok" type="submit">Start</button>
      </form>
    </dialog>
    <dialog id="settings-dialog">
      <form method="dialog">
        <h2>Settings</h2>
        <label>
          <span>Skin</span>
          <select id="skin-select"></select>
        </label>
        <label>
          <span>Character shape</span>
          <select id="character-shape-select"></select>
        </label>
        <label>
          <span>Start marker</span>
          <select id="start-shape-select"></select>
        </label>
        <label>
          <span>Goal marker</span>
          <select id="goal-shape-select"></select>
        </label>
        <menu>
          <button value="ok" type="submit">Done</button>
        </menu>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
